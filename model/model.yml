metadata:
  name: CFIHOS v2.0-aligned canonical model
  cfihos_version: '2.0'
  source: C-DM-002-Data-Dictionary-V2.0.xlsx
  source_sha256: 65262c62aec49e3a70225d8add4d9658d98a1dd5e18082c6155e94f3ec0db5a1
  license: CC BY 4.0
  publisher: IOGP JIP36
subject_areas:
  A.2: functional_asset
  A.3: physical_asset
  A.4: classification
  A.5: property
  A.6: document_reference
  A.7: document_master
  A.8: document_control
  A.9: spare_part
generation:
  spine_entities:
  - plant
  - process_unit
  - tag
  - equipment
  - document_master
  - tag_or_equipment_class
  - tag_class
  - equipment_class
  - tag_class_equipment_class_relationship
  - property
  - tag_or_equipment_class_property
  - tag_class_property
  - equipment_class_property
  - tag_property
  - equipment_property
  technical_columns:
  - name: spine_id
    datatype: STRING
    nullable: false
    definition: Golden identifier assigned by the consolidation hub.
  - name: valid_from
    datatype: TIMESTAMP
    nullable: false
    definition: Start of validity for this published version.
  - name: valid_to
    datatype: TIMESTAMP
    nullable: true
    definition: End of validity for this published version; null means current.
  - name: is_current
    datatype: BOOLEAN
    nullable: false
    definition: Whether this is the current published version.
  - name: recorded_at
    datatype: TIMESTAMP
    nullable: false
    definition: Time this version was recorded by the consolidation hub.
entities:
  site:
    name: site
    source_name: SITE
    cfihos_code: CFIHOS-00000001
    section: A.2.01
    subject_area: functional_asset
    definition: A geographical surface that can be identified on a map
    note: ''
    attributes:
    - name: site_code
      source_name: Site code
      cfihos_code: CFIHOS-10000003
      definition: A code that uniquely identifies the site
      note: ''
      example: 'Example : KAS'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: site_name
      source_name: Site name
      cfihos_code: CFIHOS-10000004
      definition: A unique name to identify a geographical location
      note: ''
      example: 'Example : Kashagan field'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: measurement_system_code
      source_name: Measurement system code
      cfihos_code: CFIHOS-10000240
      definition: The default measurement system that is used by a site
      note: ''
      example: 'Example : SI'
      requirement: mandatory
      source_format: Text, max 10 characters
      datatype: STRING
      references: measurement_system
      relationship_verb: is used by default at
  plant:
    name: plant
    source_name: PLANT
    cfihos_code: CFIHOS-00000031
    section: A.2.02
    subject_area: functional_asset
    definition: An assembly of equipment that perform a physical or chemical process, including production,
      transportation and storage
    note: A Plant represents the ''high level'' function to be performed, and during the design, a Plant
      is decomposed in Process Units and Tags.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: A code that uniquely identifies the plant
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: plant_name
      source_name: Plant name
      cfihos_code: CFIHOS-10000006
      definition: The full name of the plant
      note: ''
      example: 'Example : Onshore Processing Facility (OPF)'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: site_code
      source_name: Site code
      cfihos_code: CFIHOS-10000003
      definition: A code that uniquely identifies the site
      note: ''
      example: 'Example : KAS'
      requirement: optional
      source_format: Text, max 40 characters
      datatype: STRING
      references: site
      relationship_verb: includes
    - name: iso_language_code
      source_name: ISO language code
      cfihos_code: CFIHOS-10000147
      definition: The language that should be used by default for all exchange of information related
        to that plant
      note: ''
      example: 'Example : EN'
      requirement: optional
      source_format: Text, max 2 characters
      datatype: STRING
      references: iso_language
      relationship_verb: is the language used by default for projects at
    - name: measurement_system_code
      source_name: Measurement system code
      cfihos_code: CFIHOS-10000240
      definition: The default measurement system that is used by a plant
      note: ''
      example: 'Example : SI'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: measurement_system
      relationship_verb: is the system used by defaults for projects at
    - name: industrial_complex_code
      source_name: Industrial complex code
      cfihos_code: CFIHOS-10000367
      definition: A code that uniquely identifies the industrial complex
      note: ''
      example: 'Example : VSI'
      requirement: optional
      source_format: Text, max 40 characters
      datatype: STRING
      references: industrial_complex
      relationship_verb: includes
  process_unit:
    name: process_unit
    source_name: PROCESS UNIT
    cfihos_code: CFIHOS-00000002
    section: A.2.03
    subject_area: functional_asset
    definition: A decomposition of the ''high level'' Facility function into more granular ''sub-functions''
    note: This facility breakdown structure is decided by the process engineer.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant the process unit is part of
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: plant
      relationship_verb: is functionally divided in
    - name: process_unit_code
      source_name: Process unit code
      cfihos_code: CFIHOS-10000157
      definition: A code that uniquely identifies the process unit within the plant
      note: ''
      example: 'Example : 36'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: process_unit_name
      source_name: Process unit name
      cfihos_code: CFIHOS-10000008
      definition: A name describing the function of the process unit
      note: ''
      example: 'Example : Inlet compression'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
  area:
    name: area
    source_name: AREA
    cfihos_code: CFIHOS-00000003
    section: A.2.04
    subject_area: functional_asset
    definition: A geographical surface occupied by a Plant
    note: A plant area is created to identify the physical location of an equipment within a plant.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant the area is part of
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: plant
      relationship_verb: is geographically divided in
    - name: area_code
      source_name: Area code
      cfihos_code: CFIHOS-10000001
      definition: A code that uniquely identifies the area within the plant
      note: ''
      example: 'Example : Topsides'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: area_name
      source_name: Area name
      cfihos_code: CFIHOS-10000002
      definition: A name describing the location of an area within the plant
      note: ''
      example: 'Example : Topsides Deck 1'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
  construction_assembly:
    name: construction_assembly
    source_name: CONSTRUCTION ASSEMBLY
    cfihos_code: CFIHOS-00000026
    section: A.2.05
    subject_area: functional_asset
    definition: A grouping of tags intended to be assembled and installed as a whole
    note: Tag modules are created to facilitate fabrication during the project.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant at which the construction assembly is constructed
      note: ''
      example: 'Example : Topsides Deck 1'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: plant
      relationship_verb: is constructed by
    - name: construction_assembly_code
      source_name: Construction assembly code
      cfihos_code: CFIHOS-10000130
      definition: A code that uniquely identifies the construction assembly at a plant
      note: ''
      example: 'Example : CIU'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: construction_assembly_name
      source_name: Construction assembly name
      cfihos_code: CFIHOS-10000131
      definition: A name describing the purpose of a construction assembly
      note: ''
      example: 'Example : Chemical Injection Unit'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: parent_construction_assembly_code
      source_name: Parent construction assembly code
      cfihos_code: CFIHOS-10000175
      definition: A code that uniquely identifies the parent of a construction assembly at a plant
      note: ''
      example: 'Example : CIU'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: construction_assembly
      relationship_verb: is decomposed in
  commissioning_unit:
    name: commissioning_unit
    source_name: COMMISSIONING UNIT
    cfihos_code: CFIHOS-00000004
    section: A.2.07
    subject_area: functional_asset
    definition: A grouping of tags (if the commissioning unit is at the lowest level in the structure),
      or sub-commissioning units, by the commissioning discipline
    note: This grouping allows one to perform commissioning activities.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant the commissioning unit is part of
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: plant
      relationship_verb: is commissioned by
    - name: commissioning_unit_code
      source_name: Commissioning unit code
      cfihos_code: CFIHOS-10000009
      definition: A code that uniquely identifies the commissioning unit within a plant
      note: ''
      example: 'Example : 980'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: commissioning_unit_name
      source_name: Commissioning unit name
      cfihos_code: CFIHOS-10000010
      definition: The name by which the commission unit is usually designated
      note: ''
      example: 'Example : Plant Production Manifold East'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: parent_commissioning_unit_code
      source_name: Parent commissioning unit code
      cfihos_code: CFIHOS-10000176
      definition: A code that uniquely identifies the parent of the commission unit at the plant
      note: ''
      example: 'Example : 981'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: commissioning_unit
      relationship_verb: is decomposed in
  leaf_node_commissioning_unit:
    name: leaf_node_commissioning_unit
    source_name: LEAF NODE COMMISSIONING UNIT
    cfihos_code: CFIHOS-00000037
    section: A.2.08
    subject_area: functional_asset
    definition: A commissioning unit that is at the lowest level in the hierarchical structure of commissioning
      units
    note: ''
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant the commissioning unit is part of
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: commissioning_unit
      relationship_verb: is subtype of
    - name: commissioning_unit_code
      source_name: Commissioning unit code
      cfihos_code: CFIHOS-10000009
      definition: A code that uniquely identifies the commissioning unit within a plant
      note: ''
      example: 'Example : 980'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: commissioning_unit
      relationship_verb: is subtype of
  maintenance_unit:
    name: maintenance_unit
    source_name: MAINTENANCE UNIT
    cfihos_code: CFIHOS-00000006
    section: A.2.09
    subject_area: functional_asset
    definition: A grouping of maintenance system by the maintenance discipline. This grouping allows one
      to perform maintenance activities.
    note: ''
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant at which the maintenance unit is located
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: plant
      relationship_verb: is maintained by
    - name: maintenance_unit_code
      source_name: Maintenance unit code
      cfihos_code: CFIHOS-10000013
      definition: A code that uniquely identifies the maintenance unit at a plant
      note: ''
      example: 'Example : A01'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: maintenance_unit_name
      source_name: Maintenance unit name
      cfihos_code: CFIHOS-10000014
      definition: The name by which the maintenance unit is usually designated
      note: ''
      example: 'Example : Oil Wells and Wellhead Facilities'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
  maintenance_system:
    name: maintenance_system
    source_name: MAINTENANCE SYSTEM
    cfihos_code: CFIHOS-00000007
    section: A.2.10
    subject_area: functional_asset
    definition: A grouping of tags that can be maintained at the same time
    note: Maintenance systems are defined by the maintenance discipline.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant at which the maintenance unit is located
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: maintenance_unit
      relationship_verb: covers
    - name: maintenance_unit_code
      source_name: Maintenance unit code
      cfihos_code: CFIHOS-10000013
      definition: The maintenance unit to which the maintenance system belongs
      note: ''
      example: 'Example : A01'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: maintenance_unit
      relationship_verb: covers
    - name: maintenance_system_code
      source_name: Maintenance system code
      cfihos_code: CFIHOS-10000015
      definition: A code that uniquely identifies the maintenance system within a maintenance unit
      note: ''
      example: 'Example : A01.01'
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: maintenance_system_name
      source_name: Maintenance system name
      cfihos_code: CFIHOS-10000016
      definition: The name by which the maintenance system is usually designated
      note: ''
      example: 'Example : Oil Wells, Xmas Trees and Flowlines'
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: maintenance_system_actual_startup_date
      source_name: Maintenance system actual startup date
      cfihos_code: CFIHOS-10000017
      definition: The date at which the maintenance system has been started for the first time (on a continuous
        basis)
      note: This information is used by the maintenance discipline to develop maintenance plans, and particularly
        to determine when the first maintenance activities will have to happen.
      example: 'Example : 2010-01-01'
      requirement: optional
      source_format: Date
      datatype: DATE
      references: ''
      relationship_verb: ''
  corrosion_loop:
    name: corrosion_loop
    source_name: CORROSION LOOP
    cfihos_code: CFIHOS-00000010
    section: A.2.11
    subject_area: functional_asset
    definition: A grouping of tags with similar operating conditions, e.g. pipe, equipment, .. (i.e.,
      made of similar materials of construction, sharing similar corrosion/degradation rate)
    note: Corrosion Loops are created to monitor the corrosions of equipment and thus are important to
      establish proper inspection strategies.
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant at which the corrosion loop is located
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: plant
      relationship_verb: monitors corrosion through
    - name: corrosion_loop_code
      source_name: Corrosion loop code
      cfihos_code: CFIHOS-10000018
      definition: A code that uniquely identifies the corrosion loop at a plant
      note: ''
      example: 'Example : CL1101'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: corrosion_loop_name
      source_name: Corrosion loop name
      cfihos_code: CFIHOS-10000019
      definition: The name by which the corrosion loop is usually designated
      note: ''
      example: 'Example : Absorber circuit'
      requirement: mandatory
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: corrosion_loop_description
      source_name: Corrosion loop description
      cfihos_code: CFIHOS-10000020
      definition: A description of what the corrosion loop is
      note: ''
      example: 'Example : V301 separator vessel below demister. Condensate liquid outlet piping to BL.'
      requirement: mandatory
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: corrosion_loop_type_code
      source_name: Corrosion loop type code
      cfihos_code: CFIHOS-10000023
      definition: The type of corrosion loop that classifies this corrosion loop
      note: ''
      example: ''
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: corrosion_loop_type
      relationship_verb: classifies
    - name: corrosion_loop_process_description
      source_name: Corrosion loop process description
      cfihos_code: CFIHOS-10000021
      definition: A description of the process performed by the elements of the corrosion loop
      note: ''
      example: 'Example : V301 separates the 15 barg gas stream into dry saturated gas and condensate
        containing hydrocarbons, free sour water (CO2 and H2S) and inhibitor.'
      requirement: mandatory
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: corrosion_type_description
      source_name: Corrosion type description
      cfihos_code: CFIHOS-10000022
      definition: A description of the expected effects of the corrosion
      note: ''
      example: 'Example : Vessel is made of 15mm PWHT carbon steel including 3mm corrosion allowance.

        Normal operation Wet CO2 corrosion.

        Special operating conditions Un-inhibited the corrosion rate is 1.1mm/yr. Inhibiter injection
        should be monitored and alarmed.'
      requirement: optional
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
  corrosion_loop_type:
    name: corrosion_loop_type
    source_name: CORROSION LOOP TYPE
    cfihos_code: CFIHOS-00000011
    section: A.2.12
    subject_area: functional_asset
    definition: A classification of corrosion loops
    note: ''
    attributes:
    - name: corrosion_loop_type_code
      source_name: Corrosion loop type code
      cfihos_code: CFIHOS-10000023
      definition: A code that uniquely identifies the type of corrosion loop
      note: ''
      example: ''
      requirement: identifier
      source_format: Text, max 10 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: corrosion_loop_type_name
      source_name: Corrosion loop type name
      cfihos_code: CFIHOS-10000024
      definition: The name by which the corrosion loop type is usually designated
      note: ''
      example: ''
      requirement: mandatory
      source_format: Text, max 100 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
  tag:
    name: tag
    source_name: TAG
    cfihos_code: CFIHOS-00000028
    section: A.2.13
    subject_area: functional_asset
    definition: An object designed for performing functional requirements and serving as a specification
      for equipment
    note: ''
    attributes:
    - name: plant_code
      source_name: Plant code
      cfihos_code: CFIHOS-10000005
      definition: The plant where the tag is or will be located
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: process_unit
      relationship_verb: is functionally divided in
    - name: tag_name
      source_name: Tag name
      cfihos_code: CFIHOS-10000166
      definition: The full name of a tag
      note: Different companies have different tag naming conventions. A tag name shall be unique within
        a plant.
      example: 'Example : 036FV001'
      requirement: identifier
      source_format: Text, max 33 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: tag_description
      source_name: Tag description
      cfihos_code: CFIHOS-10000177
      definition: A functional description of the tag
      note: The description can also include the parent tag, where required. It should not include tag
        class, manufacturer and model information.
      example: 'Example : ''''Hot Oil Circulation Pump'''' that clearly describes the function of the
        pump (the equipment assigned can be centrifugal or reciprocating pump). ''''V 431 Separator Relief
        Valve'''' that clearly describes the function of the valve, with additional parent related information.'
      requirement: mandatory
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: parent_tag_name
      source_name: Parent tag name
      cfihos_code: CFIHOS-10000178
      definition: An identification of the parentage of the tag
      note: The parent tag (also called main tag) can be a package, an instrument loop or an electrical
        circuit.
      example: 'Example : 600-036F001'
      requirement: optional
      source_format: Text, max 33 characters
      datatype: STRING
      references: tag
      relationship_verb: is functionally divided in
    - name: process_unit_code
      source_name: Process unit code
      cfihos_code: CFIHOS-10000157
      definition: The process unit within the plant to which the tag provides part of the functionality
      note: ''
      example: 'Example : 36'
      requirement: mandatory
      source_format: Text, max 40 characters
      datatype: STRING
      references: process_unit
      relationship_verb: is functionally divided in
    - name: area_code
      source_name: Area code
      cfihos_code: CFIHOS-10000001
      definition: The geographical area within the plant where the tag is located
      note: ''
      example: 'Example : Topsides'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: area
      relationship_verb: locates
    - name: construction_assembly_code
      source_name: Construction assembly code
      cfihos_code: CFIHOS-10000130
      definition: The construction assembly of a plant where the tag resides
      note: This should be a leaf node construction assembly.
      example: 'Example : CIU'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: construction_assembly
      relationship_verb: groups
    - name: commissioning_unit_code
      source_name: Commissioning unit code
      cfihos_code: CFIHOS-10000009
      definition: The unit that will or has commissioned the tag
      note: This should be a leaf node commissioning unit.
      example: 'Example : 980'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: leaf_node_commissioning_unit
      relationship_verb: groups
    - name: maintenance_unit_code
      source_name: Maintenance unit code
      cfihos_code: CFIHOS-10000013
      definition: The unit that is in charge of maintaining the tag
      note: ''
      example: 'Example : KZ.KAS.H01.B02'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: maintenance_system
      relationship_verb: groups
    - name: maintenance_system_code
      source_name: Maintenance system code
      cfihos_code: CFIHOS-10000015
      definition: The maintenance system through which the tag is maintained
      note: ''
      example: 'Example : A01.01'
      requirement: optional
      source_format: Text, max 10 characters
      datatype: STRING
      references: maintenance_system
      relationship_verb: groups
    - name: corrosion_loop_code
      source_name: Corrosion loop code
      cfihos_code: CFIHOS-10000018
      definition: The corrosion loop that includes the tag
      note: ''
      example: 'Example : CL1101'
      requirement: optional
      source_format: Text, max 40 characters
      datatype: STRING
      references: corrosion_loop
      relationship_verb: groups
    - name: tag_class_name
      source_name: Tag class name
      cfihos_code: CFIHOS-10000040
