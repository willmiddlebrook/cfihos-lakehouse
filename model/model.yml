  document_master:
    name: document_master
    source_name: DOCUMENT MASTER
    cfihos_code: CFIHOS-00000022
    section: A.7.02
    subject_area: document_master
    definition: A placeholder that allows a project to identify a particular information content to be
      created or updated
    note: "A document master is identified by a document number, and it groups all the document revisions\
      \ created to mature the information content.\nAn index of document masters is called a Master Document\
      \ Register (MDR), and it allows a project to plan when the information content will reach a particular\
      \ status (e.g., AFC, ASB). \nRemark: The first issuance of the document Master will be the baseline\
      \ plan. Subsequent issuances will reflect any changes in forecast dates."
    attributes:
    - name: document_number
      source_name: Document number
      cfihos_code: CFIHOS-10000154
      definition: The unique identifier for the Document according to the Owner/Operator Document numbering
        scheme
      note: ''
      example: 'Example : KC01-71-990-KW-T-YP-0002-000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: document_title
      source_name: Document title
      cfihos_code: CFIHOS-10000168
      definition: A description, in a short and concise manner, of the content of the document
      note: The title of the document usually appears on the front page of the document or in title block.
      example: 'Example : Laydown Area & Pipe Rack North / South'
      requirement: mandatory
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: discipline_document_type_short_code
      source_name: Discipline document type short code
      cfihos_code: CFIHOS-10000207
      definition: At alternate way of identifying uniquely a combination of discipline and document type
      note: This attribute is calculated as a concatenation of the discipline code and the document type
        short code.
      example: 'Example : MP6067'
      requirement: mandatory
      source_format: Text, max 6 characters
      datatype: STRING
      references: discipline_document_type
      relationship_verb: classifies
