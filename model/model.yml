    name: document_revision
    source_name: DOCUMENT REVISION
    cfihos_code: CFIHOS-00000035
    section: A.8.01
    subject_area: document_control
    definition: A user-readable set of data structured in order to be printed and stored as a whole (includes
      drawings)
    note: "Disciplines specify the content of the documents delivered.\n\nThe file provided (See FILE_NAME\
      \ property) shall be:\n\n- The most used rendition (when than one rendition is given for the same\
      \ document).\n\n- The entry point for the document (e.g., the table of content, when the document\
      \ has been split into multiple files).\n\n\n\nRemark: \n\n- All files generated in PDF format shall\
      \ be text-searchable with commenting enabled.\n\n- All files shall be fully virus checked by the\
      \ Contractor before submission."
    attributes:
    - name: document_number
