  tag_physical_connection:
    name: tag_physical_connection
    source_name: TAG PHYSICAL CONNECTION
    cfihos_code: CFIHOS-00000038
    section: A.3.02
    subject_area: physical_asset
    definition: A physical connection between tags
    note: This information is primarily used for mechanical completions. For piping this information can
      be generated from 3D models. For electrical and instrumentation, this information can be generated
      from design tools. For pipes, the direction From To is the direction of the flow within the pipe.
      For electrical cables, the direction From To is the direction of the electrical current. For drivers
      (e.g., electrical motor), the From To is the direction of the flow of energy, consistent with ISO15926
      and ISO22274. For an instrument having only one connection, the From is the Tag the instrument is
      mounted on (e.g., the vessel). For a valve, not causing a line break, the From is the line the valve
      is mounted on. For auxiliary equipment (e.g., a filter), the From is the Tag where the auxiliary
      equipment is mounted on.
    attributes:
    - name: from_plant_code
      source_name: From plant code
      cfihos_code: CFIHOS-10000181
      definition: The plant the process unit is part of, and to which the originating tag belongs
      note: ''
      example: 'Example : 6000'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: tag
      relationship_verb: is the origin of
    - name: from_tag_name
