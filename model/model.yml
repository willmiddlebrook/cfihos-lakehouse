    source_name: SOURCE STANDARD DOCUMENT AND DATA REQUIREMENT
    cfihos_code: CFIHOS-00000132
    section: A.4.08
    subject_area: classification
    definition: A requirement for document or data, as expressed in a source standard, irrespective of
      the equipment class
    note: 'These Document and Data Requirements are of two kinds: 1) Design: Information generated during
      the design activity that has to be approved and reviewed by the purchaser. 2) Equipment: Information
      generated by the equipment manufacturer. This entity represents how to best manage this data, as
      all document and data requirements expressed in a standard are independent of the equipment classes
      the standard is covering. In the RDL, this table only contains the entries for document and data
      requirements as expressed in public standards. Owners / operators are expected to download them
      in their database, and then to complement that list with their own document and data requirements
      for their standards.'
