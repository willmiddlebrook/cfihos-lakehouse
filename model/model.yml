  additional_file:
    name: additional_file
    source_name: ADDITIONAL FILE
    cfihos_code: CFIHOS-00000023
    section: A.8.04
    subject_area: document_control
    definition: A file that makes up a particular document revision.
    note: "In some circumstances, a particular document revision can be made up of more than one file.\
      \ \n\nExamples include:\n\n- Native files\n- Translations of a document\n- Large documents that\
      \ have been split into several smaller files\n\nWhen this is the case, all these files shall be\
      \ provided as a ''set of files''."
    attributes:
    - name: document_number
      source_name: Document number
      cfihos_code: CFIHOS-10000154
      definition: The unique identifier for the document according to the Owner/Operator document numbering
        scheme, to which the additional file is associated
      note: ''
      example: 'Example : T-10000001'
      requirement: identifier
      source_format: Text, max 40 characters
      datatype: STRING
      references: document_revision
      relationship_verb: is complemented by zero, one or more
    - name: document_revision_code
      source_name: Document revision code
      cfihos_code: CFIHOS-10000162
      definition: A code used to identify the content of a document at a certain point in time according
        to the Owner/Operator Document Revision Coding scheme
      note: It is used to track the evolution of a document during its lifecycle and is applied at time
        of release from Originator to reflect the document is frozen.
      example: 'Example : 00001'
      requirement: identifier
      source_format: Text, max 5 characters
      datatype: STRING
      references: document_revision
      relationship_verb: is complemented by zero, one or more
    - name: file_title
      source_name: File title
      cfihos_code: CFIHOS-10000126
      definition: A description in a short and concise manner of the content of the additional file
      note: This is not meant to repeat the document title. The FILE_TITLE shall be unique within a particular
        document revision. Refer to the chapter Set of Files for more information.
      example: 'Example : PEFS Crude Oil Booster Pumps (Native)'
      requirement: identifier
      source_format: Text, max 255 characters
      datatype: STRING
      references: ''
      relationship_verb: ''
    - name: file_name
      source_name: File name
      cfihos_code: CFIHOS-10000127
      definition: The unique name of the electronic file (including its extension)
