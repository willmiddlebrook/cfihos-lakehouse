resources:
  jobs:
    foundation:
      name: ${bundle.target}-cfihos-foundation
      tasks:
        - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/deploy_foundation.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"

    load_rdl:
      name: ${bundle.target}-cfihos-load-rdl
      tasks:
        - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/deploy_foundation.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default
        - task_key: load_core_rdl
          depends_on:
            - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/load_rdl.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --rdl-version
              - "2.0"
          environment_key: default
        - task_key: enforce_constraints
          depends_on:
            - task_key: load_core_rdl
          spark_python_task:
            python_file: ../src/validate.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: yaml
      environments:
        - environment_key: default
          spec:
            client: "1"
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2

    onramp:
      name: ${bundle.target}-cfihos-onramp
      parameters:
        - name: source_config
          default: example_cmms.yml
        - name: dry_run
          default: "false"
      tasks:
        - task_key: run_onramp
          spark_python_task:
            python_file: ../src/onramp/engine.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --config
              - "{{job.parameters.source_config}}"
              - "--dry-run={{job.parameters.dry_run}}"
          environment_key: yaml
      environments:
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2

    profile_source:
      name: ${bundle.target}-cfihos-profile-source
      parameters:
        - name: source
          default: example_cmms
        - name: table
          default: ${var.catalog}.bronze.example_locations
      tasks:
        - task_key: profile_source
          spark_python_task:
            python_file: ../src/onramp/profile_source.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --source
              - "{{job.parameters.source}}"
              - --table
              - "{{job.parameters.table}}"
          environment_key: yaml
      environments:
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2

    validate:
      name: ${bundle.target}-cfihos-validate
      tasks:
        - task_key: enforce_constraints
          spark_python_task:
            python_file: ../src/validate.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: yaml
      environments:
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2

    acceptance:
      name: ${bundle.target}-cfihos-acceptance
      tasks:
        - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/deploy_foundation.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default
        - task_key: load_core_rdl
          depends_on:
            - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/load_rdl.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --rdl-version
              - "2.0"
          environment_key: default
        - task_key: run_acceptance
          depends_on:
            - task_key: load_core_rdl
          spark_python_task:
            python_file: ../src/acceptance.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: yaml
        - task_key: enforce_constraints
          depends_on:
            - task_key: run_acceptance
          spark_python_task:
            python_file: ../src/validate.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: yaml
      environments:
        - environment_key: default
          spec:
            client: "1"
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2
