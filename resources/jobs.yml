resources:
  jobs:
    foundation:
      name: ${bundle.target}-cfihos-foundation
      tasks:
        - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/deploy_foundation.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"

    load_rdl:
      name: ${bundle.target}-cfihos-load-rdl
      tasks:
        - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/deploy_foundation.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default
        - task_key: load_core_rdl
          depends_on:
            - task_key: deploy_foundation
          spark_python_task:
            python_file: ../src/load_rdl.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --rdl-version
              - "2.0"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"

    conform:
      name: ${bundle.target}-cfihos-conform
      parameters:
        - name: yaml_file
          default: src/conform/sources/demo_plants.yml
      tasks:
        - task_key: conform_source
          spark_python_task:
            python_file: ../src/conform.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --yaml-file
              - "{{job.parameters.yaml_file}}"
          environment_key: yaml
      environments:
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2

    acceptance:
      name: ${bundle.target}-cfihos-acceptance
      tasks:
        - task_key: run_acceptance
          spark_python_task:
            python_file: ../src/acceptance.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: yaml
      environments:
        - environment_key: yaml
          spec:
            client: "1"
            dependencies:
              - PyYAML==6.0.2
